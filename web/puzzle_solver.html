<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NYT Spelling Bee Solver</title>
    <style>
    body {
        background-color: darkgrey;
        margin: 0 10%;
        font-family: sans-serif;
    }
    input {
        background-color: gold;
    }
    </style>
</head>
<body>
<h1>NYT Spelling Bee Puzzle Solver</h1>

<h2>Enter Letters</h2>
<form id="form">
    <div class="input-group">
        <label for="req">Required Letter: </label>
        <input id="req" name="req" type="text" maxlength="1" size="2" required/>
        <br>
        <label for="let3">Letter 3: </label>
        <input id="let3" name="let3" type="text" maxlength="1" size="2" required/>
        <br>
        <label for="let1">Letter 1: </label>
        <input id="let1" name="let1" type="text" maxlength="1" size="2" required/>
        <br>
        <label for="let2">Letter 2: </label>
        <input id="let2" name="let2" type="text" maxlength="1" size="2" required/>
        <br>
        <label for="let4">Letter 4: </label>
        <input id="let4" name="let4" type="text" maxlength="1" size="2" required/>
        <br>
        <label for="let5">Letter 5: </label>
        <input id="let5" name="let5" type="text" maxlength="1" size="2" required/>
        <br>
        <label for="let6">Letter 6: </label>
        <input id="let6" name="let6" type="text" maxlength="1" size="2" required/>
        <br>
        <label for="puzzdate">Puzzle Date (Optional)</label>
        <input id="puzzdate" type="date" name="puzzdate" value="2026-8-15">
    </div>
    <button type="submit">Solve Puzzle</button>
    <button type="reset">Start Over</button>
</form>

<h2>Response: </h2>
<pre id="response"></pre>

</body>

<script>
async function handleSubmit(event) {
    event.preventDefault();

    const data = new FormData(event.target);
    const value = Object.fromEntries(data.entries());
    value.req = data.get("req");
    value.let1 = data.get("let1");
    value.let2 = data.get("let2");
    value.let3 = data.get("let3");
    value.let4 = data.get("let4");
    value.let5 = data.get("let5");
    value.let6 = data.get("let6");
    value.puzzdate = data.get("puzzdate");
    console.log({value});

    const response = await fetch('http://localhost:5000/puzzle', {
        method: 'POST',
        body: JSON.stringify(value),
        headers: {
            'Content-Type': 'application/json',
            }
        });
    const myJson = await response.json();
    console.log(myJson);
    document.getElementById('response').textContent = JSON.stringify(myJson, undefined, 2);
    document.getElementById("form").reset();
}
const form1 = document.getElementById("form");
form1.addEventListener("submit", async (e) => handleSubmit(e), false);

</script>

</html>
